# ---------- Core / console ----------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Keep logging off to reduce size and avoid early boot overhead
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=4096

# ---------- Drivers ----------
CONFIG_GPIO=y
CONFIG_SPI=y

# ---------- Display + LVGL ----------
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_LABEL=y

# Enough pool for simple labels
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# For ST7735 common configs
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_16_SWAP=y

# ---------- CAN (MCP2515) ----------
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y